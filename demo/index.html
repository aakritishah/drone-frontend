<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedIC Drone Demo Video</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #060809;
      color: #dceaf8;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    .video-wrap {
      width: min(100%, 1000px);
    }

    video {
      width: 100%;
      height: auto;
      border: 1px solid #1a2535;
      border-radius: 8px;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <main class="video-wrap">
    <video controls playsinline preload="metadata">
      <source src="../HUM_demo.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </main>
</body>
</html>
